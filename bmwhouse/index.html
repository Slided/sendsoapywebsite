<script>
  const OWNER = "Slided";
  const REPO = "sendsoapywebsite";
  const FOLDER = "bmwhouse/texts";

  const grid = document.getElementById("grid");

  async function loadFiles() {
    const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`;
    const res = await fetch(apiUrl);
    const files = await res.json();

    for (const file of files) {
      if (file.name.endsWith(".txt")) {
        const text = await fetch(file.download_url).then(r => r.text());
        createCard(file.name, text);
      }
    }
  }

  function createCard(name, text) {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="filename">${name}</div>
      <div class="content"></div>
    `;

    card.querySelector(".content").textContent = text;
    grid.appendChild(card);
  }

  loadFiles();
</script>
